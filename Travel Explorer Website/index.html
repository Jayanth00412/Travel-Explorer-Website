<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Karnataka Travel Explorer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <h3>Travel Explorer — Karnataka</h3>
      <p class="tag">Historic places, photos & live weather</p>
    </div>

    <div class="controls">
      <input id="searchBar" type="search" placeholder="Search places (e.g. Hampi, Mysore) ..." />
    </div>
  </header>

  <main>
    <div id="loader" class="loader">Loading places…</div>
    <section id="places" class="grid"></section>
  </main>

  <footer>
    <small>&copy; 2025 Karnataka Travel Explorer
      <br>
      contact:00000000
    </small>
  </footer>

  <script defer src="script.js"></script>
  <script defer src="places.js"></script>
</body>
</html>
